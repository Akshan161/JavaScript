<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Class Scheduler & Countdown webpage with live clock, routine loader, and interactive countdown timer." />
  <title>Class Scheduler & Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-container">
    <h1 class="page-title">Class Scheduler & Countdown</h1>

    <!-- Card 1: Current Time -->
    <section class="card time-card" aria-label="Current Live Time">
      <h2 class="card-subtitle">Current Time</h2>
      <div id="currentTime" class="time-display" aria-live="polite">--:--:-- --</div>
    </section>

    <!-- Card 2: Upcoming Class & Countdown -->
    <section class="card timer-card" aria-label="Upcoming Class Countdown">
      <h2 id="upcomingTitle" class="card-subtitle upcoming-title">
        Upcoming: <span id="currentSubjectVenue">Web Technologies (Lab 3)</span>
      </h2>

      <!-- Live countdown digits -->
      <div id="countdownDisplay" class="countdown-display" aria-live="assertive">00:15</div>

      <!-- Control Buttons -->
      <div class="timer-controls">
        <button id="btnStart" class="btn btn-primary" type="button">Start</button>
        <button id="btnPause" class="btn btn-primary" type="button">Pause</button>
        <button id="btnReset" class="btn btn-primary" type="button">Reset</button>
      </div>

      <!-- Custom Seconds Input -->
      <div class="custom-timer-form">
        <input 
          id="customSecondsInput" 
          type="number" 
          min="1" 
          max="3600" 
          placeholder="Enter seconds" 
          aria-label="Enter countdown seconds"
        />
        <button id="btnSet" class="btn btn-primary" type="button">Set</button>
      </div>

      <!-- Real-time status / notification -->
      <div id="statusMessage" class="status-message ready-status" role="status">
        Ready for next class.
      </div>
    </section>

    <!-- Card 3: Class Routine -->
    <section class="card routine-card" aria-label="Class Routine">
      <h2 class="card-subtitle routine-title">Class Routine</h2>
      <ul id="routineList" class="routine-list" role="list">
        <!-- Rendered dynamically by routine.js -->
      </ul>
    </section>

    <!-- Bottom Badge -->
    <div class="footer-badge">
      <span class="badge-pill">ES6 Modules (http)</span>
    </div>
  </main>

  <!-- ES6 Module Entry Point -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
