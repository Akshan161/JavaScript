<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Switch - Akshan Motghare</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 40px 50px;
      user-select: none;
    }

    .student-title {
      font-size: 24px;
      font-weight: bold;
      color: #000000;
      margin-bottom: 35px;
    }

    .boxes-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .color-box {
      width: 320px;
      height: 85px;
      border: 2px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Initial state */
    .box-red {
      background-color: #ff0000;
      color: #ffffff;
    }

    .box-yellow {
      background-color: #ffff00;
      color: #000000;
    }

    /* Switched state (as shown in screenshot) */
    .switched .box-red {
      background-color: #ffff00;
      color: #000000;
    }

    .switched .box-yellow {
      background-color: #ff0000;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h2 class="student-title">Akshan Motghare (24070521276)</h2>

  <div class="boxes-container switched" id="boxesContainer">
    <div class="color-box box-red" id="box1">Red Box</div>
    <div class="color-box box-yellow" id="box2">Yellow Box</div>
  </div>

  <script>
    const container = document.getElementById('boxesContainer');
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');

    // Toggle color switch on click
    function toggleColors() {
      container.classList.toggle('switched');
    }

    box1.addEventListener('click', toggleColors);
    box2.addEventListener('click', toggleColors);
  </script>

</body>
</html>
