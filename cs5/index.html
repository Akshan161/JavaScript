<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find Minimum and Maximum values in an array of numbers easily with interactive controls.">
  <title>Find Minimum and Maximum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-wrapper">
    <div class="card">
      <h1 class="card-title">Find Minimum and Maximum</h1>
      
      <div class="input-group">
        <label for="numbersInput" class="input-label">Enter numbers (comma, space or newline separated):</label>
        <textarea 
          id="numbersInput" 
          rows="4" 
          placeholder="12, 45, 2, 89, 34" 
          spellcheck="false"
        >12, 45, 2, 89, 34</textarea>
      </div>

      <div class="button-row">
        <button id="sampleBtn" type="button" class="btn btn-secondary">Use Sample Array</button>
        <button id="computeBtn" type="button" class="btn btn-primary">Compute Min & Max</button>
        <button id="clearBtn" type="button" class="btn btn-ghost" title="Clear input">Clear</button>
      </div>

      <div id="errorBox" class="error-box" style="display: none;"></div>

      <div id="resultBox" class="result-box">
        <p class="result-row">
          <span class="result-label">Array:</span>
          <span id="arrayOutput" class="result-value">[12, 45, 2, 89, 34]</span>
        </p>
        <p class="result-row">
          <span class="result-label">Min:</span>
          <span id="minOutput" class="result-value bold-stat min-val">2</span>
        </p>
        <p class="result-row">
          <span class="result-label">Max:</span>
          <span id="maxOutput" class="result-value bold-stat max-val">89</span>
        </p>

        <div class="additional-stats" id="additionalStats">
          <div class="stat-badge">
            <span class="badge-label">Count</span>
            <span id="countOutput" class="badge-val">5</span>
          </div>
          <div class="stat-badge">
            <span class="badge-label">Sum</span>
            <span id="sumOutput" class="badge-val">182</span>
          </div>
          <div class="stat-badge">
            <span class="badge-label">Average</span>
            <span id="avgOutput" class="badge-val">36.4</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
